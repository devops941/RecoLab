version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: recolab-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/models_storage:/app/models_storage
      - ./backend/reports_storage:/app/reports_storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: recolab-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  uploads:
  models_storage:
  reports_storage:
